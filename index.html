<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE EMBLEM</title>

    <!-- Bootstrap 5 -->
    <link
      href="assets/bootstrap/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./assets/css/newstyle.css?v=2.1" />
  </head>

  <body>
    <img
      src="./assets/images/product/logo_product.png"
      class="sticky-icon left logo-product"
      alt="Left Icon"
    />
    <img
      src="./assets/images/product/logo_paragon.png"
      class="sticky-icon right logo-paragon"
      alt="Right Icon"
    />

    <!-- Section 1 -->
    <section class="page-section section1">
      <picture>
        <source
          media="(max-width: 1023px)"
          srcset="./assets/images/product/product-mobile-1.jpg"
        />
        <img
          src="./assets/images/product/product-1.jpg"
          class="section-img"
          alt=""
        />
      </picture>
      <a href="#section5" class="section-btn"></a>
    </section>

    <!-- Section 2 -->
    <section class="page-section section2">
      <picture>
        <source
          media="(max-width: 1023px)"
          srcset="./assets/images/product/product-mobile-2.jpg"
        />
        <img
          src="./assets/images/product/product-2.jpg"
          class="section-img"
          alt=""
        />
      </picture>
      <a href="#section5" class="section-btn"></a>
    </section>

    <!-- Section 3 (with form) -->
    <section class="page-section section3">
      <picture>
        <source
          media="(max-width: 1023px)"
          srcset="./assets/images/product/product-mobile-3.jpg"
        />
        <img
          src="./assets/images/product/product-3.jpg"
          class="section-img"
          alt=""
        />
      </picture>
      <div class="product-slider" id="productSlider3">
        <button class="slider-arrow arrow-left" id="sliderArrowLeft" aria-label="Previous">
          <img src="./assets/images/product/arrow-left.png" alt="Previous" />
        </button>
        <div class="slider-track">
          <div class="slider-track-inner">
            <img
              src="./assets/images/product/product-3-silver.png"
              class="slide"
              alt="Product view 1"
            />
            <img
              src="./assets/images/product/product-3-rosegold.png"
              class="slide"
              alt="Product view 2"
            />
          </div>
        </div>
        <button class="slider-arrow arrow-right" id="sliderArrowRight" aria-label="Next">
          <img src="./assets/images/product/arrow-right.png" alt="Next" />
        </button>
      </div>

      <div class="form-container right">
        <picture class="form-image form-image-1 mt-3 mb-0 mb-md-1" id="formImage1">
          <source
            media="(max-width: 1023px)"
            srcset="./assets/images/product/product-3-mobile-white-gold.png"
            id="formImage1MobileSource"
          />
          <img
            src="./assets/images/product/product-3-text-white-gold.png"
            style="width: 100%; height: auto; display: block;"
            alt="Image"
            id="formImage1Img"
          />
        </picture>
        <picture class="form-image form-image-2 mt-0 mt-md-1 mb-1 mb-md-3">
          <source
            media="(max-width: 1023px)"
            srcset="./assets/images/product/product-3-mobile-text2.png"
          />
          <img
            src="./assets/images/product/product-3-text2.png"
            style="width: 100%; height: auto; display: block;"
            alt="Image"
          />
        </picture>
        <form class="form-content" id="form1">
          <div class="mb-2">
            <input
              type="text"
              class="form-control"
              placeholder="Name"
              required
            />
          </div>
          <div class="mb-2">
            <input
              type="tel"
              class="form-control"
              placeholder="Phone"
              inputmode="numeric"
              maxlength="10"
              required
            />
          </div>
          <div class="form-check mb-1 mb-lg-3">
            <input
              class="form-check-input"
              type="checkbox"
              name="check1"
              value=""
              id="termsCheck"
              required
            />
            <label class="form-check-label" for="termsCheck">
              Accept Customer Privacy
            </label>
          </div>
          <div class="mb-1 mb-md-3 text-white">[CAPTCHA]</div>
          <button type="submit" class="transparent-btn">
            <img src="./assets/images/product/form-button.png" class="w-100" />
          </button>
        </form>
      </div>
    </section>

    <!-- Section 4 -->
    <section class="page-section section4">
      <picture>
        <source
          media="(max-width: 1023px)"
          srcset="./assets/images/product/product-mobile-4.jpg"
        />
        <img
          src="./assets/images/product/product-4.jpg"
          class="section-img"
          alt=""
        />
      </picture>
      <a href="#section5" class="section-btn"></a>
    </section>

    <!-- Section 5 (with form) -->
    <section class="page-section section5" id="section5">
      <picture>
        <source
          media="(max-width: 1023px)"
          srcset="./assets/images/product/product-mobile-5.jpg"
        />
        <img
          src="./assets/images/product/product-5.jpg"
          class="section-img"
          alt=""
        />
      </picture>
      <div class="form-container left">
        <img
          src="./assets/images/product/product-5-text1.png"
          class="form-image form-image-1"
          alt="Image"
        />
        <form class="form-content" id="form2">
          <div class="my-2">
            <input
              type="text"
              class="form-control"
              placeholder="Name"
              required
            />
          </div>
          <div class="mb-2">
            <input
              type="tel"
              class="form-control"
              placeholder="Phone"
              inputmode="numeric"
              maxlength="10"
              required
            />
          </div>
          <div class="form-check mb-3">
            <input
              class="form-check-input"
              type="checkbox"
              name="check2"
              value=""
              id="termsCheck5"
              required
            />
            <label class="form-check-label" for="termsCheck5">
              Accept Customer Privacy
            </label>
          </div>
          <div class="mb-3 text-white">[CAPTCHA]</div>
          <button type="submit" class="transparent-btn">
            <img src="./assets/images/product/form-button.png" class="w-100" />
          </button>
        </form>
        <img
          src="./assets/images/product/product-5-text2.png"
          class="form-image form-image-2 mb-0 mt-1 mt-md-3"
          alt="Image"
        />
      </div>
    </section>

    <!-- Thank you page -->
    <section
      id="section-submitted"
      class="page-section section-submitted d-none"
    >
      <picture>
        <source
          media="(max-width: 1023px)"
          srcset="./assets/images/product/product-mobile-11.jpg"
        />
        <img
          src="./assets/images/product/product-11.jpg"
          class="section-img"
          alt=""
        />
      </picture>
    </section>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const links = document.querySelectorAll('a[href^="#"]');

        links.forEach((link) => {
          link.addEventListener("click", function (e) {
            const targetId = this.getAttribute("href");
            const target = document.querySelector(targetId);

            if (target) {
              e.preventDefault();
              target.scrollIntoView({ behavior: "smooth", block: "start" });
            }
          });
        });

        const form1 = document.getElementById("form1");
        const form2 = document.getElementById("form2");
        const sectionSubmitted = document.getElementById("section-submitted");

        function handleFormSubmit(e) {
          e.preventDefault();

          sectionSubmitted.classList.remove("d-none");

          setTimeout(() => {
            sectionSubmitted.scrollIntoView({
              behavior: "smooth",
              block: "start",
            });
          }, 100);
        }

        form1.addEventListener("submit", handleFormSubmit);
        form2.addEventListener("submit", handleFormSubmit);

        // --- Product Slider (Section 3) — arrow controls, swipe-enabled, no auto-advance, no loop ---
        const sliderEl = document.getElementById("productSlider3");
        if (sliderEl) {
          const track = sliderEl.querySelector(".slider-track-inner");
          const slides = sliderEl.querySelectorAll(".slide");
          const slideCount = slides.length;
          const arrowLeft = document.getElementById("sliderArrowLeft");
          const arrowRight = document.getElementById("sliderArrowRight");
          const formImage1Img = document.getElementById("formImage1Img");
          const formImage1MobileSource = document.getElementById("formImage1MobileSource");
          let current = 0;
          let trackWidth = sliderEl.offsetWidth;

          const formImages = [
            {
              desktop: "./assets/images/product/product-3-text-white-gold.png",
              mobile: "./assets/images/product/product-3-mobile-white-gold.png",
            },
            {
              desktop: "./assets/images/product/product-3-text-pink-gold.png",
              mobile: "./assets/images/product/product-3-mobile-pink-gold.png",
            },
          ];

          function setTransform(offsetPercent, animate = true) {
            track.style.transition = animate ? "transform 0.5s ease" : "none";
            track.style.transform = `translateX(${offsetPercent}%)`;
          }

          function updateArrows() {
            arrowLeft.style.visibility = current === 0 ? "hidden" : "visible";
            arrowRight.style.visibility = current === slideCount - 1 ? "hidden" : "visible";
          }

          function updateFormImage() {
            const data = formImages[current];
            if (!data) return;
            formImage1Img.src = data.desktop;
            formImage1MobileSource.srcset = data.mobile;
          }

          function goToSlide(index, animate = true) {
            current = Math.max(0, Math.min(slideCount - 1, index));
            setTransform(current * -100, animate);
            updateArrows();
            updateFormImage();
          }

          arrowLeft.addEventListener("click", () => goToSlide(current - 1));
          arrowRight.addEventListener("click", () => goToSlide(current + 1));

          // Drag / swipe to slide (touch + mouse)
          let startX = 0;
          let isDragging = false;
          let dragOffsetPercent = 0;

          function dragStart(x) {
            startX = x;
            isDragging = true;
            trackWidth = sliderEl.offsetWidth;
          }

          function dragMove(x) {
            if (!isDragging) return;
            const deltaPx = x - startX;
            dragOffsetPercent = (deltaPx / trackWidth) * 100;
            setTransform(current * -100 + dragOffsetPercent, false);
          }

          function dragEnd() {
            if (!isDragging) return;
            isDragging = false;
            const threshold = 15; // percent of track width
            if (dragOffsetPercent < -threshold) {
              goToSlide(current + 1);
            } else if (dragOffsetPercent > threshold) {
              goToSlide(current - 1);
            } else {
              goToSlide(current);
            }
            dragOffsetPercent = 0;
          }

          sliderEl.addEventListener("touchstart", (e) => dragStart(e.touches[0].clientX), { passive: true });
          sliderEl.addEventListener("touchmove", (e) => dragMove(e.touches[0].clientX), { passive: true });
          sliderEl.addEventListener("touchend", dragEnd);

          sliderEl.addEventListener("mousedown", (e) => {
            e.preventDefault();
            dragStart(e.clientX);
          });
          window.addEventListener("mousemove", (e) => dragMove(e.clientX));
          window.addEventListener("mouseup", dragEnd);

          goToSlide(0, false);
        }
      });
    </script>
  </body>
</html>
