<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE EMBLEM</title>

    <!-- Bootstrap 5 -->
    <link
      href="assets/bootstrap/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./assets/css/newstyle.css?v=2.1" />
  </head>

  <body>
    <img
      src="./assets/images/product/logo_product.png"
      class="sticky-icon left logo-product"
      alt="Left Icon"
    />
    <img
      src="./assets/images/product/logo_paragon.png"
      class="sticky-icon right logo-paragon"
      alt="Right Icon"
    />

    <!-- Section 1 -->
    <section class="page-section section1">
      <picture>
        <source
          media="(max-width: 1023px)"
          srcset="./assets/images/product/product-mobile-1.jpg"
        />
        <img
          src="./assets/images/product/product-1.jpg"
          class="section-img"
          alt=""
        />
      </picture>
      <a href="#section5" class="section-btn"></a>
    </section>

    <!-- Section 2 -->
    <section class="page-section section2">
      <picture>
        <source
          media="(max-width: 1023px)"
          srcset="./assets/images/product/product-mobile-2.jpg"
        />
        <img
          src="./assets/images/product/product-2.jpg"
          class="section-img"
          alt=""
        />
      </picture>
      <a href="#section5" class="section-btn"></a>
    </section>

    <!-- Section 3 (with form) -->
    <section class="page-section section3">
      <picture>
        <source
          media="(max-width: 1023px)"
          srcset="./assets/images/product/product-mobile-3.jpg"
        />
        <img
          src="./assets/images/product/product-3.jpg"
          class="section-img"
          alt=""
        />
      </picture>
      <div class="product-slider" id="productSlider3">
        <div class="slider-track">
          <div class="slider-track-inner">
            <img
              src="./assets/images/product/product-3-silver.png"
              class="slide clone"
              alt="Product view (clone)"
            />
            <img
              src="./assets/images/product/product-3-rosegold.png"
              class="slide"
              alt="Product view 1"
            />
            <img
              src="./assets/images/product/product-3-silver.png"
              class="slide"
              alt="Product view 2"
            />
            <img
              src="./assets/images/product/product-3-rosegold.png"
              class="slide clone"
              alt="Product view (clone)"
            />
          </div>
        </div>
        <div class="slider-dots">
          <button class="dot active" data-index="0" aria-label="Slide 1"></button>
          <button class="dot" data-index="1" aria-label="Slide 2"></button>
        </div>
      </div>

      <div class="form-container right">
        <picture class="form-image form-image-1 mt-3 mb-0 mb-md-1">
          <source
            media="(max-width: 1023px)"
            srcset="./assets/images/product/product-3-mobile-text1.png"
          />
          <img
            src="./assets/images/product/product-3-text1.png"
            style="width: 100%; height: auto; display: block;"
            alt="Image"
          />
        </picture>
        <picture class="form-image form-image-2 mt-0 mt-md-1 mb-1 mb-md-3">
          <source
            media="(max-width: 1023px)"
            srcset="./assets/images/product/product-3-mobile-text2.png"
          />
          <img
            src="./assets/images/product/product-3-text2.png"
            style="width: 100%; height: auto; display: block;"
            alt="Image"
          />
        </picture>
        <form class="form-content" id="form1">
          <div class="mb-2">
            <input
              type="text"
              class="form-control"
              placeholder="Name"
              required
            />
          </div>
          <div class="mb-2">
            <input
              type="tel"
              class="form-control"
              placeholder="Phone"
              inputmode="numeric"
              maxlength="10"
              required
            />
          </div>
          <div class="form-check mb-1 mb-lg-3">
            <input
              class="form-check-input"
              type="checkbox"
              name="check1"
              value=""
              id="termsCheck"
              required
            />
            <label class="form-check-label" for="termsCheck">
              Accept Customer Privacy
            </label>
          </div>
          <div class="mb-1 mb-md-3 text-white">[CAPTCHA]</div>
          <button type="submit" class="transparent-btn">
            <img src="./assets/images/product/form-button.png" class="w-100" />
          </button>
        </form>
      </div>
    </section>

    <!-- Section 4 -->
    <section class="page-section section4">
      <picture>
        <source
          media="(max-width: 1023px)"
          srcset="./assets/images/product/product-mobile-4.jpg"
        />
        <img
          src="./assets/images/product/product-4.jpg"
          class="section-img"
          alt=""
        />
      </picture>
      <a href="#section5" class="section-btn"></a>
    </section>

    <!-- Section 5 (with form) -->
    <section class="page-section section5" id="section5">
      <picture>
        <source
          media="(max-width: 1023px)"
          srcset="./assets/images/product/product-mobile-5.jpg"
        />
        <img
          src="./assets/images/product/product-5.jpg"
          class="section-img"
          alt=""
        />
      </picture>
      <div class="form-container left">
        <img
          src="./assets/images/product/product-5-text1.png"
          class="form-image form-image-1"
          alt="Image"
        />
        <form class="form-content" id="form2">
          <div class="my-2">
            <input
              type="text"
              class="form-control"
              placeholder="Name"
              required
            />
          </div>
          <div class="mb-2">
            <input
              type="tel"
              class="form-control"
              placeholder="Phone"
              inputmode="numeric"
              maxlength="10"
              required
            />
          </div>
          <div class="form-check mb-3">
            <input
              class="form-check-input"
              type="checkbox"
              name="check2"
              value=""
              id="termsCheck5"
              required
            />
            <label class="form-check-label" for="termsCheck5">
              Accept Customer Privacy
            </label>
          </div>
          <div class="mb-3 text-white">[CAPTCHA]</div>
          <button type="submit" class="transparent-btn">
            <img src="./assets/images/product/form-button.png" class="w-100" />
          </button>
        </form>
        <img
          src="./assets/images/product/product-5-text2.png"
          class="form-image form-image-2 mb-0 mt-1 mt-md-3"
          alt="Image"
        />
      </div>
    </section>

    <!-- Thank you page -->
    <section
      id="section-submitted"
      class="page-section section-submitted d-none"
    >
      <picture>
        <source
          media="(max-width: 1023px)"
          srcset="./assets/images/product/product-mobile-11.jpg"
        />
        <img
          src="./assets/images/product/product-11.jpg"
          class="section-img"
          alt=""
        />
      </picture>
    </section>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const links = document.querySelectorAll('a[href^="#"]');

        links.forEach((link) => {
          link.addEventListener("click", function (e) {
            const targetId = this.getAttribute("href");
            const target = document.querySelector(targetId);

            if (target) {
              e.preventDefault();
              target.scrollIntoView({ behavior: "smooth", block: "start" });
            }
          });
        });

        const form1 = document.getElementById("form1");
        const form2 = document.getElementById("form2");
        const sectionSubmitted = document.getElementById("section-submitted");

        function handleFormSubmit(e) {
          e.preventDefault();

          sectionSubmitted.classList.remove("d-none");

          setTimeout(() => {
            sectionSubmitted.scrollIntoView({
              behavior: "smooth",
              block: "start",
            });
          }, 100);
        }

        form1.addEventListener("submit", handleFormSubmit);
        form2.addEventListener("submit", handleFormSubmit);

        // --- Product Slider (Section 3) — infinite loop carousel, drag-to-slide ---
        const sliderEl = document.getElementById("productSlider3");
        if (sliderEl) {
          const track = sliderEl.querySelector(".slider-track-inner");
          const allSlides = sliderEl.querySelectorAll(".slide");
          const dots = sliderEl.querySelectorAll(".dot");
          const realCount = dots.length; // number of real (non-clone) slides
          const totalCount = allSlides.length; // includes 2 clones (start + end)
          let position = 1; // track position; 0 = clone(last), 1..realCount = real slides, realCount+1 = clone(first)
          let autoTimer = null;
          let isAnimating = false;
          const AUTO_DELAY = 10000;
          let trackWidth = sliderEl.offsetWidth;

          function setTransform(pos, animate = true) {
            track.style.transition = animate ? "transform 0.5s ease" : "none";
            track.style.transform = `translateX(${pos * -100}%)`;
            isAnimating = animate;
          }

          function updateDots() {
            const realIndex = (position - 1 + realCount) % realCount;
            dots.forEach((d, i) => d.classList.toggle("active", i === realIndex));
          }

          function goTo(pos, animate = true) {
            position = pos;
            setTransform(position, animate);
            updateDots();
            if (animate) {
              clearTimeout(window.__sliderSafetyTimer);
              window.__sliderSafetyTimer = setTimeout(() => {
                isAnimating = false;
              }, 700); // fallback in case transitionend doesn't fire
            }
          }

          function next() {
            if (isAnimating) return;
            goTo(position + 1);
          }
          function prev() {
            if (isAnimating) return;
            goTo(position - 1);
          }

          // Seamless jump when landing on a clone
          track.addEventListener("transitionend", () => {
            isAnimating = false;
            if (position === totalCount - 1) {
              // landed on clone of first slide -> jump to real first slide
              position = 1;
              setTransform(position, false);
            } else if (position === 0) {
              // landed on clone of last slide -> jump to real last slide
              position = realCount;
              setTransform(position, false);
            }
          });

          function goToDot(index) {
            goTo(index + 1);
          }

          function startAuto() {
            stopAuto();
            autoTimer = setInterval(next, AUTO_DELAY); // always one direction
          }
          function stopAuto() {
            if (autoTimer) clearInterval(autoTimer);
          }

          dots.forEach((dot) => {
            dot.addEventListener("click", () => {
              goToDot(parseInt(dot.dataset.index, 10));
              startAuto();
            });
          });

          // Drag / swipe (touch + mouse) — still allows manual back/forth browsing
          let startX = 0;
          let isDragging = false;
          let dragOffsetPercent = 0;

          function dragStart(x) {
            startX = x;
            isDragging = true;
            trackWidth = sliderEl.offsetWidth;
            stopAuto();
          }

          function dragMove(x) {
            if (!isDragging) return;
            const deltaPx = x - startX;
            dragOffsetPercent = (deltaPx / trackWidth) * 100;
            track.style.transition = "none";
            track.style.transform = `translateX(${position * -100 + dragOffsetPercent}%)`;
          }

          function dragEnd() {
            if (!isDragging) return;
            isDragging = false;
            const threshold = 15;
            if (dragOffsetPercent < -threshold) {
              next();
            } else if (dragOffsetPercent > threshold) {
              prev();
            } else {
              goTo(position);
            }
            dragOffsetPercent = 0;
            startAuto();
          }

          sliderEl.addEventListener("touchstart", (e) => dragStart(e.touches[0].clientX), { passive: true });
          sliderEl.addEventListener("touchmove", (e) => dragMove(e.touches[0].clientX), { passive: true });
          sliderEl.addEventListener("touchend", dragEnd);

          sliderEl.addEventListener("mousedown", (e) => {
            e.preventDefault();
            dragStart(e.clientX);
          });
          window.addEventListener("mousemove", (e) => dragMove(e.clientX));
          window.addEventListener("mouseup", dragEnd);

          goTo(1, false); // start on first real slide, no animation
          startAuto();

          document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
              stopAuto();
            } else {
              isAnimating = false; // reset in case a transition got stuck while hidden
              startAuto();
            }
          });
        }
      });
    </script>
  </body>
</html>
